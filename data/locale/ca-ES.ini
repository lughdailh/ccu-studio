HelpTitle="Instruccions de CCU Studio"
HelpText="<b>Assignar i seleccionar càmeres</b><br>Fes clic dret sobre qualsevol visor per assignar-hi o canviar-ne la font. Selecciona la càmera que vols corregir amb els botons 1–4 o clicant el seu visor. Només es modifica la càmera activa.<br><br><b>Correcció de color</b><br>Ajusta vermell, verd, blau, brillantor, contrast, gamma i saturació. Les correccions s'apliquen directament a la font d'OBS i queden desades amb l'escena.<br><br><b>Comptagotes i lupa</b><br>Activa Comptagotes i clica un blanc o gris neutre dins del vídeo de la càmera activa. El selector no actua sobre les altres càmeres ni sobre les bandes negres. Lupa amplia la càmera activa ocupant tot el mosaic.<br><br><b>Instruments i comparació</b><br>Consulta l'histograma RGB, el waveform i el vectorscopi. Congelar conserva els tres instruments com a referència mentre selecciones una altra càmera. Original mostra una comparació partida entre la imatge original i la corregida, només al visor actiu.<br><br><b>Restablir</b><br>Retorna tots els controls de la càmera activa als valors neutres."
HelpCredits="CCU Studio és programari lliure sota GPL-2.0-or-later. El seu desenvolupament ha comptat principalment amb l'assistència d'OpenAI Codex/ChatGPT i Claude. Les donacions ajuden a continuar desenvolupant eines noves."
