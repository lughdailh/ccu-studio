HelpTitle="CCU Studio instructions"
HelpText="<b>Assigning and selecting cameras</b><br>Right-click any preview to assign or change its source. Select the camera you want to correct with buttons 1–4 or by clicking its preview. Only the active camera is modified.<br><br><b>Color correction</b><br>Adjust red, green, blue, brightness, contrast, gamma, and saturation. Corrections are applied directly to the OBS source and saved with the scene.<br><br><b>Eyedropper and zoom</b><br>Enable Eyedropper and click a neutral white or grey area inside the active camera video. The picker cannot affect other cameras or black bars. Zoom enlarges the active camera across the complete mosaic.<br><br><b>Scopes and comparison</b><br>Use the RGB histogram, waveform, and vectorscope. Freeze retains all three scopes as a reference while you select another camera. Original displays a split comparison of the original and corrected image in the active preview only.<br><br><b>Reset</b><br>Returns every active-camera control to its neutral value."
HelpCredits="<b>A project by:</b><br>Lluís Bartra Homedes for<br>Moiz i Bartra Produccions, SL &amp;<br>El Català Emprenyat (<a href=\"https://emprenyat.cat\">emprenyat.cat</a>)<br><br><b>Software conceived and created entirely in Catalonia</b><br><br><b>Project website:</b><br><a href=\"https://emprenyat.cat/obs/CCUstudio\">https://emprenyat.cat/obs/CCUstudio</a><br><br>CCU Studio is free software licensed under GPL-2.0-or-later. Its development was assisted primarily by OpenAI Codex/ChatGPT and Claude. Donations help support the development of additional tools."
